services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: quoteiq
      POSTGRES_PASSWORD: quoteiq
      POSTGRES_DB: quoteiq
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quoteiq"]
      interval: 3s
      retries: 20
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://quoteiq:quoteiq@db:5432/quoteiq
      STORAGE_PATH: /app/storage
    ports: ["8000:8000"]
    volumes: [storage:/app/storage]
    depends_on: { db: { condition: service_healthy } }
  web:
    build: { context: ./frontend }
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata: {}
  storage: {}
