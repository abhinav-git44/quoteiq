# Render Blueprint: API (Docker, with Tesseract) + PostgreSQL + persistent disk for uploads/reports.
# Render dashboard → New → Blueprint → pick this repo. Then set GEMINI_API_KEY (free) and optionally CORS_ORIGINS.
databases:
  - name: quoteiq-db
    plan: free
    databaseName: quoteiq
    user: quoteiq

services:
  - type: web
    name: quoteiq-api
    runtime: docker
    plan: free               # free: sleeps after ~15 min idle; files restored from demo_data on each start
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    buildFilter:              # frontend-only commits do not restart the API (and its extraction jobs)
      paths: ["backend/**", "scripts/**", "demo_data/**"]
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: quoteiq-db, property: connectionString }
      - key: GEMINI_API_KEY          # free key from aistudio.google.com
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: LLM_PROVIDER
        value: auto                  # uses Claude if ANTHROPIC_API_KEY is also set, else Gemini
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_PATH
        value: /app/storage
      - key: CORS_ORIGINS
        sync: false          # e.g. https://quoteiq.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
