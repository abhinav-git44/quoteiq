# Render Blueprint: API (Docker, with Tesseract) + PostgreSQL + persistent disk for uploads/reports.
# Render dashboard → New → Blueprint → pick this repo. Then set ANTHROPIC_API_KEY and CORS_ORIGINS.
databases:
  - name: quoteiq-db
    plan: free
    databaseName: quoteiq
    user: quoteiq

services:
  - type: web
    name: quoteiq-api
    runtime: docker
    plan: starter            # disks need a paid plan; free plan works but uploads are lost on restart
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: storage
      mountPath: /app/storage
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: quoteiq-db, property: connectionString }
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_PATH
        value: /app/storage
      - key: CORS_ORIGINS
        sync: false          # e.g. https://quoteiq.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
